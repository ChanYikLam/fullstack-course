# 模块 8.5：GitHub Actions 自动部署配置
# 保存为：.github/workflows/deploy.yml
#
# 使用前需在 GitHub → Settings → Secrets and variables → Actions 中设置：
#   SERVER_HOST: 你的服务器公网 IP
#   SERVER_USER: ubuntu（SSH 用户名）
#   SERVER_SSH_KEY: 你的 SSH 私钥内容（cat ~/.ssh/id_ed25519）
#
# 然后在服务器上添加公钥：
#   cat ~/.ssh/id_ed25519.pub >> ~/.ssh/authorized_keys

name: Deploy to Server

on:
  push:
    branches: [main]
    # main 分支有推送 → 自动触发部署

  workflow_dispatch:
    # 允许手动触发部署（GitHub Actions 页面 → Run workflow）

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy backend to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /home/ubuntu/blog/backend

            echo ">>> 拉取最新代码"
            git pull origin main

            echo ">>> 安装依赖"
            source .venv/bin/activate
            pip install -r requirements.txt --quiet

            echo ">>> 重启服务"
            sudo systemctl restart blog-api

            echo ">>> 检查服务状态"
            sudo systemctl status blog-api --no-pager | head -5

            echo "部署完成！"

      - name: Notify success
        if: success()
        run: echo "部署成功！"

      - name: Notify failure
        if: failure()
        run: echo "部署失败，请检查日志。"
